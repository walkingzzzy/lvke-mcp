# PEP 639 SPDX license expression (`license = "MIT"` below) requires
# setuptools>=77. Keep this floor in lockstep with the `license` form in
# [project]; an older build backend rejects the string form. The floor also
# matches the root `hermes-agent` pyproject so the two can share one build
# toolchain in the repo venv.
#
# MCP 发行版是独立包:name = "lvke-mcp"(≠ hermes-agent)。MCP 服务不读取
# Hermes 配置/代码/环境变量(MCP_INDEPENDENCE_PLAN §6.1)。此处只声明 MCP
# 运行自身直接依赖的库;领域服务在纵向切片阶段各自追加自己的直接依赖。
[build-system]
requires = ["setuptools>=77.0,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "lvke-mcp"
version = "0.1.0"
description = "绿科 MCP 服务发行版 —— 14 个领域与参考 server 的独立运行时(runtime)与领域包"
readme = "README.md"
# 与根 pyproject 对齐:上界 <3.14 阻止 uv 在 Rust 后端传递依赖(pydantic-core
# 等)尚无 cp314 wheel 的 3.14 解释器上做源码构建。
# 下界 >=3.12 由 deep-research-ocr extra 的 numpy==2.5.1 决定(该版本自身要求
# >=3.12)。uv 解析的是覆盖全部 extra 的 universal lock,所以即使不安装该
# extra,声明 >=3.11 也会让整个工程解析不出解(与 --no-extra 无关)。
requires-python = ">=3.12,<3.14"
authors = [{ name = "湖北绿科" }]
license = "MIT"
dependencies = [
  # 与根 pyproject 相同的 exact-pin 策略:每个直接依赖 ==X.Y.Z,不写区间。
  # 版本与本仓库 venv 内已装版本一致(见 MCP_INDEPENDENCE_PLAN 基线记录)。
  "mcp==2.0.0",
  "mcp-types==2.0.0",        # mcp 2.x 的硬传递依赖,显式钉住保证干净 venv 可复现
  "pydantic==2.13.4",
  "jsonschema==4.26.0",
  "anyio==4.12.1",
  "filelock==3.24.3",
  # 领域搬移直接依赖（与根 pyproject/uv.lock 版本一致）：
  # python-docx: DOCX 导出/读取（报告域 artifacts/doc_service）
  # openpyxl: Excel 桥（finance_export/reader）
  # lxml: docx_fonts 与 XML 解析
  "python-docx==1.1.2",
  "openpyxl==3.1.5",
  "xlrd==2.0.1",
  "lxml==6.1.1",
  # fonttools: 按报告实际字形子集化 OFL CJK 字体并嵌入 DOCX，保证隔离渲染可见
  "fonttools==4.63.0",
  # 财务域 registry / spec_builder（与根 pyproject/uv.lock 版本一致）：
  # pyyaml: industry/policy profile 与 scale/env 参数读取
  # openai: spec_builder 可选 LLM 定规范（无网关时静默回退 flat）
  "pyyaml==6.0.3",
  "openai==2.24.0",
  # pypdf: 来源域 PDF 文本层解析（_parse_bytes 的 pdf_page locator）。纯 Python、
  # 零传递依赖。扫描版 PDF 无文本层时诚实报 needs_ocr,不在此处引入 OCR 栈
  # (PyMuPDF/rapidocr 含二进制轮子,单机发行体积与跨平台构建代价过高)。
  "pypdf==6.1.1",
]

[project.optional-dependencies]
# 扫描版 / Identity-H 编码 PDF 的 OCR 回退栈。刻意留在 extras：含二进制轮子
# （PyMuPDF、onnxruntime、opencv），装上后体积增加数百 MB，跨平台构建代价高，
# 而多数 PDF 有可用文本层并不需要它。
#
# 何时必须装：中文政府公报类 PDF 常用 Identity-H 子集化字体，ToUnicode 表往中文
# 字形缺映射，pypdf 只能抽出数字与标点、中文整段丢空。此时 extractor 的
# _needs_ocr_fallback 会判定文本层不可用并转 OCR；缺本组依赖则降级保留文本层，
# 并在 metadata 置 text_layer_degraded / ocr_unavailable_reason 如实上报。
deep-research-ocr = [
  "pymupdf==1.28.2",              # fitz：按页渲染位图供 OCR
  "numpy==2.5.1",                 # rapidocr 的数组输入
  "pillow==12.3.0",               # 位图解码
  "rapidocr-onnxruntime==1.2.3",  # OCR 引擎（自带中英文模型，离线可用）
]

[project.scripts]
lvke-mcp-scaffold = "lvke_mcp.servers.scaffold.server:main"

[tool.pytest.ini_options]
# 两条路径都要显式声明,否则默认验证入口按执行方式给出不同结果:
#
# - ``src``: editable 安装的 .pth 已经加了它,但 wheel 环境或未安装时没有。
# - ``.``  : ``scripts/`` 没有 __init__.py,只能作为隐式命名空间包被解析,
#   而这要求仓库根在 sys.path 上。``python -m pytest`` 会把 CWD 塞进
#   sys.path 所以碰巧能过;``uv run pytest`` 走 console script 没有这个
#   副作用,于是 test_asset_staging_audit / test_golden_samples_manifest
#   在收集阶段就 ModuleNotFoundError: No module named 'scripts'。
#
# 结论:这是默认入口缺配置,不是某个执行器的问题。钉死在这里让
# ``uv run pytest`` 与 ``python -m pytest`` 收集到同一批测试。
pythonpath = ["src", "."]

[tool.ruff]
# 固化规则集,让 ruff 可以真正当发布门禁用(此前无配置、244 errors)。
target-version = "py312"
line-length = 120

[tool.ruff.lint.per-file-ignores]
# 逐条豁免都写明原因。这里刻意**不**豁免 F401:门面 re-export 已经用
# ``__all__`` 显式声明公开面解决,不靠关检查掩盖——盲跑 ``ruff --fix`` 会删掉
# 197 个符号并让财务导出/十三表渲染模块 ImportError。
#
# 独立脚本先 ``sys.path.insert`` 再 import lvke_mcp:没有安装包时这是唯一
# 可行顺序,E402 在此是正确写法而非疏漏。
"scripts/create_research_package.py" = ["E402"]
"scripts/run_report_flow.py" = ["E402"]
# 门面把 re-export 放在实现函数之后,保持读者先看到主流程。
"src/lvke_mcp/domains/finance/tables_service.py" = ["E402"]
# ``try: from ... import InvestmentBreakdown / except ImportError`` 是可用性探测,
# 绑定名本身不使用,_HAS_INVESTMENT_BREAKDOWN 才是结果。
"src/lvke_mcp/domains/finance/_finance_model/base.py" = ["F401"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lvke_mcp = [
  # 领域数据文件(yaml/json)与 server seed 数据随 wheel 打包,保证干净环境可运行
  "domains/**/config/**/*",
  "domains/**/docs/**/*",
  "domains/**/assets/**/*",
  "standards/**/*",
  "servers/*/seed/**/*",
  "config/**/*",
  "runtime/build_metadata.json",
  "runtime/skill_inventory.json",
  # 与上面两个同目录的 runtime 契约文件一起打包。此前漏掉它，导致
  # src/lvke_mcp/runtime/ 下三个 json 只有两个进 wheel——放在包内却不随包
  # 分发，定位矛盾。
  "runtime/skill_tool_mapping.json",
]
