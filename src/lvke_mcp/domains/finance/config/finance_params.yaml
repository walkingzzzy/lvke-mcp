# 财务评价基准参数（M1 T1.3）
# 依据：《建设项目经济评价方法与参数（第三版）》(发改投资〔2006〕1325号)
#       《关于调整部分行业建设项目财务基准收益率的通知》(发改投资〔2013〕586号)
# 说明：以下为行业财务基准收益率(税后)量级参考值，落地前须按最新发布/项目实际复核。
#       第三版为现行版，2023 已启动修订，发布新版后需同步更新本文件。

social_discount_rate: 0.08          # 社会折现率(受益期长可降,不低于 0.06)
default_benchmark_rate: 0.08        # 缺省财务基准收益率(税后)
default_loan_rate: 0.045           # 缺省贷款年利率

# 行业财务基准收益率(税后)——关键词匹配 requirement.industry
industry_benchmark_rate:
  制造: 0.08
  工业: 0.08
  电子: 0.08
  化工: 0.09
  电力: 0.07
  能源: 0.07
  市政: 0.06
  公用: 0.06
  基础设施: 0.06
  交通: 0.06
  农业: 0.07
  林业: 0.06
  水利: 0.06
  房地产: 0.10
  商业: 0.10
  仓储物流: 0.08
  医药: 0.09

# 资本金最低比例(合规下限,供校验提示)
min_capital_ratio:
  一般工业: 0.20
  化工: 0.30
  公共服务: 0.30
  房地产: 0.30

# 行业净利率参考(供 M3 双路径交叉验证的外部基准；须复核)
industry_profit_margin:
  制造: 0.08
  电子: 0.10
  化工: 0.12
  电力: 0.15
  农业: 0.06
  医药: 0.15
  商业: 0.05
  仓储物流: 0.10
industry_profit_margin_default: 0.08

# 行业投资回收期(动态,年)参考上限(供交叉验证)
industry_payback_max:
  制造: 12
  电子: 10
  电力: 15
  市政: 20
  农业: 12
industry_payback_max_default: 12

# ── P1：项目性质维度（gov=政府投资项目 / enterprise=企业投资项目）──
# 关键适用性红线：发改投资〔2013〕586号《行业财务基准收益率取值表》仅适用于
#   政府投资项目及按政府要求做经济评价的项目；核准制/备案制的企业投资项目
#   （发改投资〔2006〕1325号第九条）可依投资者要求自选最低可接受收益率。
# 因此对企业项目，行业基准收益率只作“参考/交叉验证锚”，不作“达标判定硬门槛”。
project_nature:
  gov:
    # 政府投资项目：行业基准收益率作达标门槛
    benchmark_is_hard_gate: true
    note: "行业基准收益率按 586 号取值，作 IRR 达标判定门槛"
  enterprise:
    # 企业投资项目：基准收益率仅参考，达标以投资者最低可接受收益率为准
    benchmark_is_hard_gate: false
    default_min_acceptable_return: 0.08   # 缺投资者口径时的兜底参考（须项目覆盖）
    note: "企业投资项目基准收益率仅参考；达标以投资者自定最低可接受收益率为准（1325号第九条）"

# 现行项目资本金最低比例（国发〔2019〕26号口径，供校验提示；须按最新政策复核）
# 说明：min_capital_ratio 为历史/通用下限；下表为按现行制度细分的参考值。
min_capital_ratio_2019:
  房地产其他: 0.25
  保障房: 0.20
  普通商品房: 0.20
  港口沿海及内河航运: 0.20
  机场: 0.25
  铁路公路: 0.20
  城市轨道交通: 0.20
  其他基础设施: 0.20

# ── BC-P3：成本/税/残值缺省参数（消灭引擎散落硬编码 H3）──
# 三级取值：spec.cost/spec.tax 优先 → 本表 → 引擎内置兜底（=下列值，保证零改动等价旧行为）。
cost_defaults:
  total_cost_rate: 0.75       # 缺成本明细时的总成本费用率（原 finance_model 硬编码 0.75）
  wage_rate: 0.15             # 工资占现金经营成本比例（缺输入时估算，原硬编码 0.15）
  welfare_rate: 0.14          # 职工福利/附加占工资比例（原硬编码 0.14）
  salvage_rate: 0.05          # 固定资产残值率（原硬编码 0.05）
  surtax_rate: 0.01           # 营业税金及附加率（原硬编码 0.01）
  bep_fixed_cost_ratio: 0.30  # 盈亏平衡点估算的固定成本占比（原硬编码 0.3）
  income_tax_rate: 0.25       # 企业所得税率（原硬编码 0.25）
  vat_rate: 0.13              # 增值税销项适用税率(缺省)
  vat_input_rate: 0.10        # 增值税进项综合抵扣率(缺省)
