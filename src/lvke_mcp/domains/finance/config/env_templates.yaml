# 环保投资与成本模板（M5 T5.4）：按行业给"三废"治理措施 + 环保投资/运行成本量级参考，
# 供影响效果章（环境影响）grounding 与成本要素结构化（环保运行费进总成本）使用。
# 说明：环保投资率（占建设投资比例）与吨治理成本为可研估算级量级参考，
# 须按环评批复、地方排放标准与项目实际工程量复核，不作精算依据。

default:
  env_invest_ratio: 0.03          # 环保投资占建设投资比例（估算级）
  env_opex_ratio: 0.02            # 环保设施年运行费占营业收入比例（估算级）
  eia_level: "报告表"              # 环评文件等级（报告书/报告表/登记表），须按名录核定
  measures:                        # 典型"三废"治理措施（供正文环境影响章论证）
    - "废水：清污分流 + 污水处理站（生化/物化），达标纳管或回用"
    - "废气：颗粒物/VOCs 收集 + 除尘/活性炭吸附，达标排放"
    - "固废：一般固废分类暂存综合利用，危废合规委外处置"
    - "噪声：设备减振 + 隔声降噪，厂界达标"

industry:
  制造:
    env_invest_ratio: 0.04
    env_opex_ratio: 0.025
    eia_level: "报告书"
    measures:
      - "废水：生产废水经预处理 + 生化处理达标，雨污/清污分流"
      - "废气：工艺废气收集经除尘 + VOCs 治理达标排放"
      - "固废：一般固废综合利用，危废（污泥/废矿物油）合规委外处置"
      - "噪声：高噪声设备减振隔声，厂界噪声达标"
  化工:
    env_invest_ratio: 0.08
    env_opex_ratio: 0.05
    eia_level: "报告书"
    measures:
      - "废水：分质预处理 + 生化 + 深度处理，重点污染物达标"
      - "废气：酸碱废气/VOCs 分类治理，配套非甲烷总烃在线监测"
      - "固废：危废规范贮存并委外处置，建危废台账"
      - "风险：设置事故应急池与围堰，编制突发环境事件应急预案"
  文旅:
    env_invest_ratio: 0.02
    env_opex_ratio: 0.015
    eia_level: "报告表"
    measures:
      - "废水：生活污水经一体化设施处理达标回用或纳管"
      - "固废：垃圾分类收集清运，餐厨垃圾合规处置"
      - "生态：控制建设对地形植被扰动，做好水土保持与生态修复"
      - "噪声：游乐/机电设备降噪，敏感时段限噪"
  农业:
    env_invest_ratio: 0.03
    env_opex_ratio: 0.02
    eia_level: "报告表"
    measures:
      - "废水：养殖/加工废水厌氧+好氧处理，沼液沼渣资源化还田"
      - "废气：恶臭气体收集除臭，规模化畜禽场配套治理"
      - "固废：畜禽粪污/秸秆综合利用，病死动物无害化处理"
      - "面源：科学施肥用药，控制农业面源污染"
  房地产:
    env_invest_ratio: 0.02
    env_opex_ratio: 0.01
    eia_level: "报告表"
    measures:
      - "废水：生活污水纳入市政管网，雨污分流"
      - "扬尘：施工期围挡/洒水/覆盖，运营期绿化降尘"
      - "固废：生活垃圾分类收集，建筑垃圾合规清运消纳"
      - "噪声：施工期限时作业，设备减振降噪，达标排放"
